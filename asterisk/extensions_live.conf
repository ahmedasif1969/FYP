[fyp-internal]
exten => 100,1,Answer()
 same => n,Set(FYP_REQUEST=/var/spool/asterisk/kaavish/${UNIQUEID}-request)
 same => n,Set(FYP_REPLY=/var/spool/asterisk/kaavish/${UNIQUEID}-reply)
 same => n,Playback(beep)
 same => n,Record(${FYP_REQUEST}.wav,0,8,q)
 same => n,AGI(fyp_live.py,${FYP_REQUEST}.wav,${FYP_REPLY}.wav)
 same => n(reply),GotoIf($["${STAT(e,${FYP_REPLY}.wav)}" = "1"]?play)
 same => n,Playback(beeperr)
 same => n,Goto(wait_for_caller)
 same => n(play),Playback(${FYP_REPLY})
 same => n(wait_for_caller),Playback(silence/10)
 same => n,Goto(wait_for_caller)

exten => 101,1,Answer()
 same => n,Playback(beep)
 same => n,Echo()
 same => n,Hangup()

exten => 102,1,Answer()
 same => n,Set(FYP_REQUEST=/var/spool/asterisk/kaavish/${UNIQUEID}-request)
 same => n,Playback(beep)
 same => n,Record(${FYP_REQUEST}.wav,0,8,q)
 same => n,Playback(${FYP_REQUEST})
 same => n,Goto(100,wait_for_caller)

exten => 103,1,Answer()
 same => n,Set(FYP_REQUEST=/var/spool/asterisk/kaavish/${UNIQUEID}-request)
 same => n,Set(FYP_REPLY=/var/spool/asterisk/kaavish/${UNIQUEID}-reply)
 same => n,Set(FYP_CONTEXT=none)
 same => n,Set(EAGI_AUDIO_FORMAT=slin)
 same => n(listen),Playback(beep)
 same => n,Set(FYP_CONTINUE=0)
 same => n,EAGI(fyp_live.py,${FYP_REQUEST}.wav,${FYP_REPLY}.wav,voice,${FYP_CONTEXT},${FYP_QWEN_MODE})
 same => n,GotoIf($["${STAT(e,${FYP_REPLY}.wav)}" = "1"]?speak)
 same => n,Playback(beeperr)
 same => n,Goto(100,wait_for_caller)
 same => n(speak),Playback(${FYP_REPLY})
 same => n,TrySystem(/usr/bin/rm -f -- '${FYP_REQUEST}.wav' '${FYP_REPLY}.wav')
 same => n,GotoIf($["${FYP_CONTINUE}" = "1"]?listen)
 same => n,Goto(100,wait_for_caller)

exten => 104,1,Set(FYP_QWEN_MODE=strict)
 same => n,Goto(103,1)

exten => h,1,ExecIf($["${FYP_REQUEST}" != ""]?TrySystem(/usr/bin/rm -f -- '${FYP_REQUEST}.wav' '${FYP_REPLY}.wav'))
